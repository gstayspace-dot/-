name: Add administrator order edit SMS resend
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: primeval-falcon-491105-i9
          workload_identity_provider: projects/865821327055/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@primeval-falcon-491105-i9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and publish administrator order resend
        run: |
          python3 patches/order-resend/stage.py
          cp order-resend-stage.json patches/order-resend/order-resend-stage.json
          python3 patches/order-resend/promote.py
      - uses: actions/upload-artifact@v4
        with:
          name: order-resend-stage
          path: |
            order-resend-stage.json
            order-resend-deployment.json
