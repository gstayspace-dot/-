name: Stage administrator card checkout
on:
  push:
    branches: [fix/product-cart-confirm]
    paths: [.github/workflows/admin-card-stage.yml, patches/admin-card/stage.py]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: primeval-falcon-491105-i9
          workload_identity_provider: projects/865821327055/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@primeval-falcon-491105-i9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Test exact source and deploy candidate without production traffic
        run: python3 patches/admin-card/stage.py
      - uses: actions/upload-artifact@v4
        with:
          name: admin-card-stage
          path: admin-card-stage.json
          retention-days: 7
