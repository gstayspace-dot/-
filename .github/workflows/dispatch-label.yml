name: Display dispatch origin on customer cart labels
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: primeval-falcon-491105-i9
          workload_identity_provider: projects/865821327055/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@primeval-falcon-491105-i9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and publish dispatch label wording
        run: |
          python3 patches/dispatch-label/stage.py
          cp dispatch-label-stage.json patches/dispatch-label/dispatch-label-stage.json
          python3 patches/dispatch-label/promote.py
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-label-stage
          path: |
            dispatch-label-stage.json
            dispatch-label-deployment.json
