name: Publish shared customer catalog drawer and search
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: primeval-falcon-491105-i9
          workload_identity_provider: projects/865821327055/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@primeval-falcon-491105-i9.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and publish catalog drawer and search
        run: |
          python3 patches/catalog-drawer/stage.py
          cp catalog-drawer-stage.json patches/catalog-drawer/catalog-drawer-stage.json
          python3 patches/catalog-drawer/promote.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-drawer-stage
          path: |
            catalog-drawer-stage.json
            catalog-drawer-deployment.json
